name: Build installable APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare optional persistent signing key
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VEP_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.VEP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VEP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VEP_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/vep-release.jks"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Persistent signing secrets are not configured; debug APK will still be built."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          VEP_KEYSTORE_PATH: ${{ runner.temp }}/vep-release.jks
          VEP_KEYSTORE_PASSWORD: ${{ secrets.VEP_KEYSTORE_PASSWORD }}
          VEP_KEY_ALIAS: ${{ secrets.VEP_KEY_ALIAS }}
          VEP_KEY_PASSWORD: ${{ secrets.VEP_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify release APK signature
        if: steps.signing.outputs.available == 'true'
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VivaldiExternalPlayer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VivaldiExternalPlayer-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/vep-release.jks"
