name: Build installable debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Apply Batch 4 Kotlin source
        id: batch4
        shell: bash
        run: |
          cat .batch4-patch/part-00.b64 .batch4-patch/part-01.b64 .batch4-patch/part-02.b64 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/batch4-code.patch

          if git apply --check /tmp/batch4-code.patch; then
            git apply /tmp/batch4-code.patch
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VivaldiExternalPlayer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit compiled Batch 4 Kotlin source
        if: steps.batch4.outputs.applied == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/vivaldiplayer/BrowserResolverActivity.kt \
                  app/src/main/java/com/example/vivaldiplayer/PlayerActivity.kt
          git commit -m "Apply Batch 4 Kotlin source"
          git push
