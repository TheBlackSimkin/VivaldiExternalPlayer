name: Build installable APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug and optional signed release APK
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VEP_KEYSTORE_BASE64 }}
          VEP_KEYSTORE_PASSWORD: ${{ secrets.VEP_KEYSTORE_PASSWORD }}
          VEP_KEY_ALIAS: ${{ secrets.VEP_KEY_ALIAS }}
          VEP_KEY_PASSWORD: ${{ secrets.VEP_KEY_PASSWORD }}
        run: |
          gradle :app:assembleDebug --stacktrace
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 4

          if [ -n "$KEYSTORE_B64" ] && [ -n "$VEP_KEYSTORE_PASSWORD" ] && [ -n "$VEP_KEY_ALIAS" ] && [ -n "$VEP_KEY_PASSWORD" ]; then
            export VEP_KEYSTORE_PATH="$RUNNER_TEMP/vep-release.jks"
            echo "$KEYSTORE_B64" | base64 --decode > "$VEP_KEYSTORE_PATH"
            gradle :app:assembleRelease --stacktrace
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 app/build/outputs/apk/release/app-release.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | head -n 4
            rm -f "$VEP_KEYSTORE_PATH"
          else
            echo "Persistent signing secrets are not configured; debug APK only."
          fi

      # The permanently signed release is the important distribution artifact.
      # Upload it first so a debug-artifact quota problem can never suppress it.
      - name: Upload signed release APK when available
        uses: actions/upload-artifact@v4
        with:
          name: VivaldiExternalPlayer-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
          retention-days: 30

      # Debug APKs are only short-lived QA checkpoints and do not need long retention.
      - name: Upload debug APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: VivaldiExternalPlayer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
